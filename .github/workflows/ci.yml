name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/axiomiq_db?schema=public"
      JWT_SECRET: "ci_jwt_secret_key_for_testing_2026"
      PORT: "5000"
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Setup CI Environment File
        working-directory: ./backend
        run: cp .env.example .env

      - name: Validate Prisma Schema
        working-directory: ./backend
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Syntax & Structure Verification
        working-directory: ./backend
        run: node -c src/server.js

  frontend-validation:
    name: Frontend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Platform Bindings for Oxlint
        working-directory: ./frontend
        run: npm install --no-save @oxlint/binding-linux-x64-gnu

      - name: Run Linter (oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Production Bundle Build (Vite)
        working-directory: ./frontend
        run: npm run build
