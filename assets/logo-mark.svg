<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5"/>
  
  <g transform="rotate(-6 60 60) translate(0, 2)">
    <!-- Antenna Stem & Ball -->
    <line x1="62" y1="22" x2="69" y2="8" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round"/>
    <circle cx="72" cy="6" r="6.5" fill="url(#brandGrad)"/>

    <!-- Left Ear Disc -->
    <ellipse cx="28" cy="52" rx="7" ry="12" stroke="#F8FAFC" stroke-width="6" fill="#334155"/>

    <!-- Right Ear Disc -->
    <ellipse cx="92" cy="58" rx="11" ry="14" stroke="#F8FAFC" stroke-width="6" fill="#334155"/>
    <ellipse cx="92" cy="58" rx="5" ry="7" fill="url(#brandGrad)"/>

    <!-- Main Robot Head Shell -->
    <path d="M 33 40 C 33 32, 45 23, 62 23 C 79 23, 91 32, 91 40 L 87 75 C 87 90, 75 97, 60 97 C 45 97, 34 88, 33 75 Z" fill="#1E293B" stroke="#F8FAFC" stroke-width="6" stroke-linejoin="round"/>

    <!-- Top Rim Curve -->
    <path d="M 33 40 C 42 49, 78 49, 91 40" stroke="#F8FAFC" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Visor Area -->
    <path d="M 40 54 C 40 48, 47 45, 59 45 C 72 45, 80 48, 80 54 C 80 61, 72 65, 59 65 C 47 65, 40 61, 40 54 Z" fill="#FFFFFF"/>

    <!-- Eyes (smiling curved arches) -->
    <path d="M 46 54 C 47 48, 51 48, 52 54" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 66 54 C 67 48, 71 48, 72 54" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Neck / Collar -->
    <path d="M 50 83 L 53 72 L 67 72 L 70 83 Z" fill="url(#brandGrad)"/>
  </g>
</svg>
