<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="28" fill="#172B4D" />
  <g transform="rotate(-6 60 60) translate(0, 2)">
    <!-- Antenna Stem & Ball -->
    <line x1="62" y1="22" x2="69" y2="8" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="72" cy="6" r="6" fill="#356AE6"/>

    <!-- Left Ear Disc -->
    <ellipse cx="28" cy="52" rx="7" ry="12" stroke="#FFFFFF" stroke-width="6" fill="#1E3A5F"/>

    <!-- Right Ear Disc -->
    <ellipse cx="92" cy="58" rx="11" ry="14" stroke="#FFFFFF" stroke-width="6" fill="#1E3A5F"/>
    <ellipse cx="92" cy="58" rx="5" ry="7" fill="#356AE6"/>

    <!-- Main Robot Head Shell -->
    <path d="M 33 40 C 33 32, 45 23, 62 23 C 79 23, 91 32, 91 40 L 87 75 C 87 90, 75 97, 60 97 C 45 97, 34 88, 33 75 Z" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Top Rim Curve -->
