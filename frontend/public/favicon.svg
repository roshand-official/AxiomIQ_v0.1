    <!-- Visor Area -->
    <path d="M 40 54 C 40 48, 47 45, 59 45 C 72 45, 80 48, 80 54 C 80 61, 72 65, 59 65 C 47 65, 40 61, 40 54 Z" fill="#FFFFFF"/>

    <!-- Eyes (smiling curved arches) -->
